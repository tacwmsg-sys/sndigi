<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f1;--ink:#15221a;--mute:#56645a;--card:#ffffff;--line:#d9dfd2;--accent:#f0a500;--green:#2f5d3a;--on-accent:#15221a;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a13;--ink:#eef2e8;--mute:#a4b3a7;--card:#17251b;--line:#2a3b2e;--accent:#f5b72e;--green:#8fc79a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a13;--ink:#eef2e8;--mute:#a4b3a7;--card:#17251b;--line:#2a3b2e;--accent:#f5b72e;--green:#8fc79a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.1rem/1.65 Newsreader,Georgia,serif}
h1,h2,h3,.nav{font-family:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif}
a{color:inherit}a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px;font-weight:500;font-size:.98rem}
.nav nav{display:flex;gap:22px;align-items:center}.nav a{text-decoration:none}.nav a:hover{color:var(--green)}
.logo{font-weight:800;font-size:1.1rem}
#theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:4px 12px;font:inherit;cursor:pointer}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:64px 0 72px}
.hero h1{font-size:clamp(2.2rem,5.8vw,4.3rem);line-height:.98;margin:0 0 20px;font-weight:800;letter-spacing:-.03em}
.hero .role{white-space:pre-line;font-size:1.35rem;color:var(--green);margin:0 0 16px;font-style:italic}
.hero p.lead{max-width:34em;color:var(--mute);margin:0 0 28px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;text-decoration:none;padding:12px 22px;border-radius:999px;border:2px solid var(--ink)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:hover{transform:translateY(-2px)}
.photo{position:relative;justify-self:center;width:100%;max-width:380px}
.photo::before{content:"";position:absolute;inset:18px -18px -18px 18px;background:var(--accent);border-radius:190px 190px 24px 24px}
.frame{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:190px 190px 24px 24px;background:var(--line)}.photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 20%;transform:scale(1.3);transform-origin:50% 28%}
section{padding:64px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(1.8rem,4vw,2.6rem);margin:0 0 28px;letter-spacing:-.02em}
.timeline{position:relative;display:grid;gap:28px;padding-left:34px}.timeline::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:3px;background:var(--line);border-radius:2px}.job{position:relative;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:14px}.job::before{content:"";position:absolute;left:-34px;top:26px;width:21px;height:21px;border-radius:50%;background:var(--accent);border:4px solid var(--bg);box-shadow:0 0 0 2px var(--green)}.job .when{display:inline-block;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:.9rem;color:var(--on-accent);background:var(--accent);padding:3px 12px;border-radius:999px;margin-bottom:10px}.job h3{margin:0 0 4px;font-size:1.25rem}.job .org{color:var(--green);margin:0 0 12px;font-style:italic}.job ul{margin:0;padding:0;list-style:none}.job li{position:relative;padding-left:22px;margin-bottom:6px;color:var(--mute)}.job li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--green)}
.about{display:grid;grid-template-columns:1fr 1fr;gap:40px}.about p{margin:0 0 1em;max-width:34em}
.facts{list-style:none;margin:0;padding:0}.facts li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.facts b{font-family:'Bricolage Grotesque',sans-serif;font-weight:700}.facts span{color:var(--mute);text-align:right}
.chips{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding-bottom:6px}.chips span{flex:0 0 auto;white-space:nowrap;padding:8px 14px;border:1.5px solid var(--green);color:var(--green);border-radius:999px;font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:1.25rem}.card p{margin:0;color:var(--mute);font-size:1.02rem}
.card .tags{margin-top:auto;font-size:.9rem;color:var(--green);font-family:'Bricolage Grotesque',sans-serif;font-weight:500}
.contact a.big{display:flex;width:fit-content;max-width:100%;align-items:center;gap:.35em;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1.4rem,5vw,2.6rem);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:6px;text-underline-offset:6px;word-break:break-all}
.contact svg{flex:0 0 auto;width:1em;height:1em;color:var(--green)}.phone{display:flex;width:fit-content;align-items:center;gap:.4em;margin-top:14px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(1.2rem,4vw,1.8rem);text-decoration:none}.phone:hover{color:var(--green)}.links{display:flex;gap:20px;flex-wrap:wrap;margin-top:24px;font-family:'Bricolage Grotesque',sans-serif;font-weight:500}
footer{padding:28px 0 40px;color:var(--mute);font-size:.95rem;border-top:1px solid var(--line)}
@media(max-width:760px){.hero,.about{grid-template-columns:1fr}.hero{padding-top:36px}.photo{order:-1;max-width:280px;margin-right:18px}.nav nav a.hide{display:none}}
@media(prefers-reduced-motion:no-preference){.hero .photo{animation:rise .8s ease both}@keyframes rise{from{opacity:0;transform:translateY(18px)}}}
</style></head><body>
